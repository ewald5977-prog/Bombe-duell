<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c1c"><title>Bomben-Duell</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#100c1c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 20%,#42203b,#100c1c 70%);display:flex;justify-content:center}main{width:min(100%,490px);padding:22px 18px 45px;text-align:center}h1{font-size:clamp(31px,8vw,46px);margin:12px 0 4px}p{color:#c9bfd1}.sub{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f6aa68}.panel{background:#ffffff0b;border:1px solid #ffffff25;border-radius:22px;padding:22px 16px;margin:20px 0;box-shadow:0 15px 40px #0004}.hidden{display:none!important}input{width:100%;padding:15px;border:1px solid #ffffff55;background:#1c172a;color:white;border-radius:12px;font-size:19px;text-align:center;margin:7px 0}button{border:0;background:linear-gradient(130deg,#ffb144,#f14a45);color:#180c15;font-weight:900;font-size:18px;padding:17px 18px;border-radius:15px;width:100%;margin:7px 0;cursor:pointer;min-height:55px}button.secondary{background:#30273d;color:white;border:1px solid #ffffff30}button:disabled{opacity:.4;cursor:default}.bomb{font-size:125px;line-height:1.25;filter:drop-shadow(0 10px 22px #f3484470);transition:transform .2s}.bomb.hot{animation:pulse .45s infinite alternate}@keyframes pulse{to{transform:scale(1.13) rotate(5deg)}}.time{font-size:64px;font-weight:950;font-variant-numeric:tabular-nums;color:#ffb14a}.score{display:flex;justify-content:space-around;font-size:20px;font-weight:800}.status{font-size:21px;font-weight:800;margin:16px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answers button{margin:0;background:#30273d;color:white;border:1px solid #ffffff40;font-size:25px}.small{font-size:13px;color:#c6b8cc}#log{min-height:20px;color:#ffce7c}.pill{display:inline-block;padding:6px 12px;border-radius:30px;background:#ffffff20}.code{font-size:35px;letter-spacing:8px;font-weight:900;color:#ffca77}.toggle{font-size:13px;width:auto;min-height:0;padding:9px 12px;background:#30273d;color:white;float:right}.winner{font-size:32px;color:#ffbd5c;font-weight:950}</style></head><body><main><button class="toggle" id="sound">🔊 Ton an</button><div class="sub">⚡ Zwei Handys · Ein Duell</div><h1>💣 Bomben-Duell</h1><p>Geheimer Zünder! Schnell lösen und weitergeben!</p>
<section id="home" class="panel"><p>Dein Spielername</p><input id="name" maxlength="18" value="Ewald" autocomplete="off"><button id="create">🎮 Spiel erstellen</button><p>oder einem Duell beitreten</p><input id="joincode" maxlength="6" placeholder="6-stelliger Code" autocomplete="off"><button class="secondary" id="join">🔗 Beitreten</button><p class="small">Keine Anmeldung. Verbindung über das Internet.</p></section>
<section id="lobby" class="panel hidden"><p>Dein Raumcode</p><div class="code" id="roomcode"></div><button id="share">📤 Einladung teilen / kopieren</button><p id="lobbystatus">Warte auf den Gegner …</p><button class="secondary" id="start" disabled>🚀 Duell starten</button></section>
<section id="game" class="hidden"><div class="score"><span id="scoreA">0</span><span>🏆 Best of 5</span><span id="scoreB">0</span></div><div class="panel"><div class="status" id="owner">Bereit?</div><div id="bomb" class="bomb">💣</div><div class="time" id="timer" style="font-size:26px;letter-spacing:1px">💓 Die Bombe tickt …</div><div class="small" id="round">Runde 1</div><div class="status" id="question"></div><div class="answers" id="answers"></div><button id="pass" disabled>💨 BOMBE WEITERGEBEN!</button><p id="log"></p></div></section>
<section id="end" class="panel hidden"><div class="winner" id="winner"></div><p id="finalscore"></p><button id="rematch">🔄 Revanche</button></section><p class="small" id="connection">Bereit für ein Duell</p></main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
'use strict';const $=id=>document.getElementById(id),show=id=>{['home','lobby','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))};let secretEndAt=0,solvedAt=0;let peer,conn,host=false,room='',me='',other='Gegner',state=null,ready=false,sound=true,clockOffset=0,roundTimeout=null,lastTick=-1;const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const rand=n=>Math.floor(Math.random()*n);const code=()=>Array.from({length:6},()=>abc[rand(abc.length)]).join('');const pid=c=>'bombenduell-v1-'+c.toLowerCase();const url=()=>location.href.split('?')[0]+'?raum='+room;const setStatus=t=>$('connection').textContent=t;
function tone(freq=440,dur=.09){if(!sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='square';g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);setTimeout(()=>a.close(),500)}catch(e){}}
function buzz(){navigator.vibrate?.([150,70,220]);tone(140,.35)}$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Ton an':'🔇 Stumm'};
let joinRetry=null,joinAttempts=0;function connectPeer(id){if(typeof Peer==='undefined'){setStatus('Verbindungsbibliothek nicht geladen. Internet prüfen.');return false}peer=new Peer(id,{debug:0});peer.on('error',e=>{const kind=e.type||e.message;setStatus('Verbindungsfehler: '+kind);if(kind==='unavailable-id'&&host){room=code();$('roomcode').textContent=room;peer.destroy();createHostPeer()}else if(!host&&(kind==='peer-unavailable'||kind==='network'||kind==='socket-error'))scheduleJoinRetry()});peer.on('disconnected',()=>{setStatus('Signaldienst getrennt – versuche erneut');if(!peer.destroyed)try{peer.reconnect()}catch(e){}});return true}
function createHostPeer(){if(!connectPeer(pid(room)))return;peer.on('open',()=>{setStatus('🟢 Raum '+room+' bereit – Einladung verschicken');$('lobbystatus').textContent='Raum bereit. Warte auf Gegner …'});peer.on('connection',c=>{if(conn?.open){c.on('open',()=>c.close());return}setup(c)})}
function scheduleJoinRetry(){if(host||conn?.open||joinRetry||joinAttempts>=12)return;joinRetry=setTimeout(()=>{joinRetry=null;attemptJoin()},2200)}
function attemptJoin(){if(host||conn?.open||!peer||peer.destroyed)return;if(!peer.open){scheduleJoinRetry();return}joinAttempts++;setStatus('Verbinde mit Raum '+room+' (Versuch '+joinAttempts+') …');try{let c=peer.connect(pid(room),{reliable:true});setup(c);c.on('error',()=>scheduleJoinRetry());setTimeout(()=>{if(!c.open){try{c.close()}catch(e){}scheduleJoinRetry()}},4500)}catch(e){scheduleJoinRetry()}}
function setup(c){conn=c;conn.on('open',()=>{if(joinRetry){clearTimeout(joinRetry);joinRetry=null}setStatus('🟢 Verbunden');if(host){other='Gegner';send({type:'hello',name:me});$('start').disabled=false;$('lobbystatus').textContent='Gegner verbunden – Spiel starten!'}else send({type:'hello',name:me})});conn.on('data',receive);conn.on('close',()=>{setStatus('🔴 Gegner getrennt');$('log').textContent='Verbindung verloren. Bitte Seite neu laden und Raum erneut öffnen.'});conn.on('error',()=>setStatus('Verbindung fehlgeschlagen'))}
function send(o){if(conn?.open)conn.send(o)}
$('create').onclick=()=>{me=$('name').value.trim()||'Spieler 1';host=true;room=code();show('lobby');$('roomcode').textContent=room;setStatus('Erstelle Raum …');createHostPeer()};
function joinRoom(){me=$('name').value.trim()||'Spieler 2';room=$('joincode').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(room)){setStatus('Bitte gültigen sechsstelligen Code eingeben');return}host=false;show('lobby');$('roomcode').textContent=room;$('start').classList.add('hidden');$('lobbystatus').textContent='Verbinde mit Gastgeber …';joinAttempts=0;if(joinRetry){clearTimeout(joinRetry);joinRetry=null}if(!connectPeer())return;peer.on('open',attemptJoin);setTimeout(()=>{if(!conn?.open)setStatus('Verbindung noch nicht möglich. Gastgeber muss Raum offen halten; Code prüfen.')},20000)}$('join').onclick=joinRoom;
$('share').onclick=async()=>{let u=url();try{if(navigator.share)await navigator.share({title:'Bomben-Duell',text:'Fordere mich heraus! Raum '+room,url:u});else{await navigator.clipboard.writeText(u);$('lobbystatus').textContent='Link kopiert! Per WhatsApp verschicken.'}}catch(e){$('lobbystatus').textContent='Link: '+u}};
function task(){let a=rand(7)+2,b=rand(7)+1,correct=a+b;let opts=new Set([correct]);while(opts.size<4)opts.add(Math.max(1,correct+rand(11)-5));return{q:`🧠 Wie viel ist ${a} + ${b}?`,opts:[...opts].sort(()=>Math.random()-.5),correct}}
function begin(){if(!host)return;secretEndAt=Date.now()+20000+rand(15001);solvedAt=0;state={type:'state',phase:'play',scores:[0,0],round:1,holder:rand(2),startedAt:Date.now(),task:task(),solved:false,seq:0,names:[me,other]};sync()}
$('start').onclick=begin;
function sync(){if(!host)return;state.seq++;send(state);render()}
function receive(d){if(!d||typeof d!=='object')return;if(d.type==='hello'){other=String(d.name||'Gegner').slice(0,18);if(host){$('lobbystatus').textContent=other+' ist dabei!';send({type:'hello',name:me})}else{$('lobbystatus').textContent='Verbunden mit '+other+' – Gastgeber startet gleich.'}return}if(d.type==='state'&&!host){if(state&&d.seq<=state.seq)return;state=d;clockOffset=0;render();return}if(!host||!state||state.phase!=='play')return;if(d.type==='answer'){if(state.holder!==1||state.solved||Date.now()>=secretEndAt)return;handleAnswer(d.value)}if(d.type==='pass'){if(state.holder!==1||!state.solved||Date.now()>=secretEndAt)return;passBomb()}if(d.type==='rematch'&&state.phase==='done')begin()}
function handleAnswer(value){if(!host||!state||state.phase!=='play'||Date.now()>=secretEndAt||state.solved)return;if(value===state.task.correct){state.solved=true;solvedAt=Date.now();sync();tone(700,.12)}else{secretEndAt-=2000;sync();tone(190,.18);checkTimeout()}}
function passBomb(){if(!host||!state||!state.solved||state.phase!=='play'||Date.now()>=secretEndAt)return;state.holder=1-state.holder;state.task=task();state.solved=false;solvedAt=0;sync();tone(520,.14)}
function checkTimeout(){if(!host||!state||state.phase!=='play'||Date.now()<secretEndAt)return;const loser=state.holder,winner=1-loser;state.scores[winner]++;state.phase=state.scores[winner]>=3?'done':'pause';state.loser=loser;sync();buzz();if(state.phase==='pause'){clearTimeout(roundTimeout);roundTimeout=setTimeout(()=>{if(!state||state.phase!=='pause')return;state.round++;state.holder=rand(2);secretEndAt=Date.now()+20000+rand(15001);solvedAt=0;state.startedAt=Date.now();state.task=task();state.solved=false;state.phase='play';sync()},2300)}}
function answer(n){if(!state||state.phase!=='play'||state.solved)return;const my=host?0:1;if(state.holder!==my)return;if(host)handleAnswer(n);else send({type:'answer',value:n})}
$('pass').onclick=()=>{if(!state||state.phase!=='play'||!state.solved||state.holder!==(host?0:1))return;if(host)passBomb();else send({type:'pass'})};$('rematch').onclick=()=>{if(host)begin();else{send({type:'rematch'});$('winner').textContent='Warte auf neue Runde …'}};
function render(){if(!state)return;if(state.phase==='done'){show('end');$('winner').textContent=state.scores[host?0:1]>=3?'🏆 Du hast gewonnen!':'💥 Du hast verloren!';$('finalscore').textContent=state.names[0]+' '+state.scores[0]+' : '+state.scores[1]+' '+state.names[1];return}show('game');$('scoreA').textContent=state.names[0]+': '+state.scores[0];$('scoreB').textContent=state.scores[1]+' :'+state.names[1];$('round').textContent='Runde '+state.round+' von maximal 5';if(state.phase==='pause'){$('owner').textContent=state.names[state.loser]+' ist explodiert! 💥';$('question').textContent='Nächste Runde startet …';$('answers').innerHTML='';$('pass').disabled=true;return}const mine=state.holder===(host?0:1);$('owner').textContent=mine?'🔥 DIE BOMBE IST BEI DIR!':'😈 Bombe bei '+state.names[state.holder];$('question').textContent=mine?(state.solved?'✅ Richtig! Weitergeben oder automatische Übergabe nach 3 Sekunden!':state.task.q):'Warte, bis die Bombe zurückkommt …';$('answers').innerHTML='';if(mine&&!state.solved){state.task.opts.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>answer(n);$('answers').appendChild(b)})}$('pass').disabled=!mine||!state.solved;$('log').textContent=mine?'Beeil dich!':'Gleich könnte sie zurückkommen!'}
setInterval(()=>{if(!state||state.phase!=='play')return;const elapsed=(Date.now()-(state.startedAt||Date.now()))/1000;const danger=elapsed>21?'🔥 KRITISCH!':elapsed>12?'⚠️ Wird gefährlich …':'💓 Die Bombe tickt …';$('timer').textContent=danger;$('bomb').classList.toggle('hot',elapsed>12);if(host){checkTimeout();if(state.phase==='play'&&state.solved&&solvedAt&&Date.now()-solvedAt>=3000)passBomb()}let tick=Math.floor(Date.now()/(elapsed>18?320:elapsed>10?650:1100));if(tick!==lastTick){lastTick=tick;tone(elapsed>18?580:elapsed>10?440:320,.045)}},100);
const q=new URLSearchParams(location.search).get('raum');if(q){$('joincode').value=q.toUpperCase();$('name').value='Regina';setStatus('Raumcode erkannt – Namen prüfen und Beitreten drücken.')}
</script></body></html>
